[project]
name = "usb-connection-information"
version = "1.1.0"
description = "A system tray application for monitoring USB devices in real-time"
authors = [
    { name = "Daniel Gauthier", email = "dan@usbconnectioninformation.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "PyGObject>=3.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "flake8>=3.8",
    "pre-commit>=3.5.0",
    "ruff>=0.3.0",
    "black>=24.0.0"
]

[project.urls]
Homepage = "https://github.com/connection-information-suite/usb-connection-information-menubar-linux"

[project.scripts]
usb-connection-information = "usb_connection_information.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usb_connection_information"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
