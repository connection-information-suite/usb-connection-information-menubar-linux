name: Test Only

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-gi \
          python3-gi-cairo \
          gir1.2-gtk-3.0 \
          usbutils \
          libcairo2-dev \
          libgirepository-2.0-dev \
          libgtk-3-dev \
          pkg-config \
          build-essential \
          gobject-introspection \
          libffi-dev \
          meson \
          ninja-build

    - name: Install Python dependencies
      run: |
        uv venv .venv
        uv pip install .[dev]

    - name: Pre-commit checks
      run: uvx pre-commit run --all-files

    - name: Test with pytest (unit tests only)
      run: |
        uv run pytest tests/test_core_logic.py -v --tb=short || uv run python test_runner.py || uv run python test_simple.py
