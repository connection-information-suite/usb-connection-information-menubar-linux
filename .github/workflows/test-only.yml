name: Test Only

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv venv .venv
        source .venv/bin/activate
        uv pip install hatchling
        uv pip install .[dev]
        # Note: We don't need PyGObject for core logic tests

    - name: Pre-commit checks
      run: |
        pre-commit run --all-files

    - name: Test with pytest (unit tests only)
      run: |
        # Try pytest first, fallback to our test runner if pytest is not available
        pytest tests/test_core_logic.py -v --tb=short || python test_runner.py || python test_simple.py
